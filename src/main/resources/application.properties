# Nome do projeto que aparece para o Spring Boot
spring.application.name=amigo-fiel-api

# --- CONEXÃO COM O BANCO DE DADOS ---
# Endereço onde o PostgreSQL está rodando 5432 = porta padrao
spring.datasource.url=jdbc:postgresql://localhost:5432/amigofiel
spring.datasource.driver-class-name=org.postgresql.Driver
# Nome do usuário administrador do PostgreSQL (o padrão na instalação é 'postgres')
spring.datasource.username=postgres

# Senha cadastrada
spring.datasource.password=123456

# --- CONFIGURAÇÕES DO HIBERNATE / JPA ---
# 'update' diz para o Spring criar ou atualizar as tabelas do banco automaticamente baseadas nas suas classes Java
spring.jpa.hibernate.ddl-auto=update

# 'true' faz o Spring mostrar no console (terminal) todos os comandos SQL que ele executar
spring.jpa.show-sql=true

# Formata o código SQL no console para ficar mais fácil de ler e entender
spring.jpa.properties.hibernate.format_sql=true

#aceita minusculas no JSONs
spring.jackson.mapper.accept-case-insensitive-enums=true